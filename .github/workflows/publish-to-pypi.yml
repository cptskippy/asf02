# Publish to PyPI on version tags (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Auth: PyPI "trusted publishing" (OIDC, PEP 741)
name: publish-to-pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC to PyPI

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          if [ "$want" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $TAG does not match version ${{ steps.version.outputs.version }} in pyproject.toml"
            exit 1
          fi

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build
        run: python -m build

      - name: Check artifacts
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
