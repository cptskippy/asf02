[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asf02"
version = "0.1.0"
description = "Python client for Lulumiao pet slow feeders (OEM ASF02 / CWH01L-A1, BLE JSON-RPC)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "cptskippy" },
    { name = "AgentCarlBrutananadilewski" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Hardware :: Communication",
]
dependencies = [
    "bleak>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["asf02*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
